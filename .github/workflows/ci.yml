name: threading
on:
  push:
    branches:
      - 'master'
  pull_request:

# One in-flight run per branch/PR. `master` is excluded from cancellation
# (github.sha makes its group unique per commit) so the history of green
# builds there stays complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        branch: [master]
        # `builder` lives on the target rather than in a keyed `include`
        # because the rows need runners an os-keyed include cannot express
        # (and so a future linux/arm64 row can pick the arm image).
        #
        # Nim branches: `devel` and `version-2-4` get the full platform
        # sweep; the older lines get a smoke row each. `version-1-6` is gone
        # on purpose — nim-lang/nightlies stopped building it and its
        # `latest-version-1-6` alias has pointed at a 2024-07-10 binary ever
        # since, so that row was asserting nothing about today's 1.6. The
        # `.nimble` floor moved to `>= 2.0.0` to match, so `version-2-0` is
        # now the oldest row and it is the one that holds that floor honest.
        target:
          - os: linux
            cpu: amd64
            nim_branch: devel
            builder: ubuntu-24.04
          # 32-bit is where the pointer-sized atomics and the channel's
          # alignment assumptions actually differ. Linux i386 is cheap
          # (a gcc-multilib wrapper, see below) and catches those far
          # faster than the windows-i386 row does.
          - os: linux
            cpu: i386
            nim_branch: devel
            builder: ubuntu-24.04
          - os: macos
            cpu: arm64
            nim_branch: devel
            builder: macos-15
          - os: windows
            cpu: amd64
            nim_branch: devel
            builder: windows-2025
          - os: windows
            cpu: i386
            nim_branch: devel
            builder: windows-2025

          - os: linux
            cpu: amd64
            nim_branch: version-2-4
            builder: ubuntu-24.04
          - os: linux
            cpu: i386
            nim_branch: version-2-4
            builder: ubuntu-24.04
          - os: macos
            cpu: arm64
            nim_branch: version-2-4
            builder: macos-15
          - os: windows
            cpu: amd64
            nim_branch: version-2-4
            builder: windows-2025
          - os: windows
            cpu: i386
            nim_branch: version-2-4
            builder: windows-2025

          - os: linux
            cpu: amd64
            nim_branch: version-2-2
            builder: ubuntu-24.04
          - os: windows
            cpu: amd64
            nim_branch: version-2-2
            builder: windows-2025

          # The oldest line still built by nightlies, kept as the floor check.
          - os: linux
            cpu: amd64
            nim_branch: version-2-0
            builder: ubuntu-24.04

    name: '${{ matrix.target.os }}-${{ matrix.target.cpu }}-nim-${{ matrix.target.nim_branch }} (${{ matrix.branch }})'
    runs-on: ${{ matrix.target.builder }}
    steps:
      - name: set `core.autocrlf` to false
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global init.defaultBranch master

      - name: Checkout threading
        uses: actions/checkout@v5
        with:
          path: threading
          submodules: false

      - name: Install dependencies (Linux i386)
        if: runner.os == 'Linux' && matrix.target.cpu == 'i386'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          # There is no 32-bit GitHub runner: the host stays x86_64 and the
          # 32-bit target is reached by putting `gcc -m32` wrappers ahead of
          # the real ones on PATH. gcc-multilib also pulls in libc6-i386,
          # which is what lets the 32-bit Nim nightly run here at all.
          #
          # tests/nim.cfg switches this row to `--cc:gcc` for the same
          # reason: clang is deliberately NOT wrapped, and would otherwise
          # emit 64-bit objects that fail to link.
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND='noninteractive' apt-get install \
            --no-install-recommends -yq gcc-multilib g++-multilib \
            libssl-dev:i386

          mkdir -p external/bin
          cat << EOF > external/bin/gcc
          #!/bin/bash

          exec $(which gcc) -m32 "\$@"
          EOF

          cat << EOF > external/bin/g++
          #!/bin/bash

          exec $(which g++) -m32 "\$@"
          EOF

          chmod 755 external/bin/gcc external/bin/g++

          echo "$PWD/external/bin" >> "${GITHUB_PATH}"

      - name: Restore MinGW-W64 (Windows) from cache
        if: runner.os == 'Windows'
        id: windows-mingw-cache
        uses: actions/cache@v5
        with:
          path: external/mingw-${{ matrix.target.cpu }}
          # Bump the suffix when changing MINGW_URL below — the old cache
          # would otherwise keep delivering the previous bundle even though
          # the archive name and contents changed.
          key: 'mingw-${{ matrix.target.cpu }}-gcc14-llvm19'

      - name: Restore Nim DLLs dependencies (Windows) from cache
        if: runner.os == 'Windows'
        id: windows-dlls-cache
        uses: actions/cache@v5
        with:
          path: external/dlls-${{ matrix.target.cpu }}
          key: 'dlls-${{ matrix.target.cpu }}'

      - name: Install MinGW64 dependency (Windows)
        if: >
          steps.windows-mingw-cache.outputs.cache-hit != 'true' &&
          runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p external
          # The GCC+LLVM winlibs variant, not the gcc-only one: tests/nim.cfg
          # builds with clang on Windows too, so `clang` and `ld.lld` have to
          # ship alongside `gcc` here.
          if [[ '${{ matrix.target.cpu }}' == 'amd64' ]]; then
            MINGW_URL="https://github.com/brechtsanders/winlibs_mingw/releases/download/14.2.0posix-19.1.7-12.0.0-msvcrt-r3/winlibs-x86_64-posix-seh-gcc-14.2.0-llvm-19.1.7-mingw-w64msvcrt-12.0.0-r3.7z"
            ARCH=64
          else
            MINGW_URL="https://github.com/brechtsanders/winlibs_mingw/releases/download/14.2.0posix-19.1.7-12.0.0-msvcrt-r3/winlibs-i686-posix-dwarf-gcc-14.2.0-llvm-19.1.7-mingw-w64msvcrt-12.0.0-r3.7z"
            ARCH=32
          fi
          curl -L "$MINGW_URL" -o "external/mingw-${{ matrix.target.cpu }}.7z"
          7z x -y "external/mingw-${{ matrix.target.cpu }}.7z" -oexternal/
          mv external/mingw$ARCH external/mingw-${{ matrix.target.cpu }}

      - name: Install DLLs dependencies (Windows)
        if: >
          steps.windows-dlls-cache.outputs.cache-hit != 'true' &&
          runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p external
          curl -L "https://nim-lang.org/download/windeps.zip" -o external/windeps.zip
          7z x -y external/windeps.zip -oexternal/dlls-${{ matrix.target.cpu }}

      - name: Path to cached dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo '${{ github.workspace }}'"/external/mingw-${{ matrix.target.cpu }}/bin" >> $GITHUB_PATH
          echo '${{ github.workspace }}'"/external/dlls-${{ matrix.target.cpu }}" >> $GITHUB_PATH

      - name: Setup Nim
        uses: alaviss/setup-nim@0.1.1
        with:
          path: 'nim'
          version: ${{ matrix.target.nim_branch }}
          architecture: ${{ matrix.target.cpu }}

      - name: Run tests
        # No flags here: `--threads:on`, `--mm:arc` and the per-target
        # compiler/sanitizer choice all live in tests/nim.cfg, which nimble
        # picks up because it is next to the test files. Passing `--gc:arc`
        # on the command line only re-stated it and earned a deprecation
        # warning on every single compile.
        run: |
          cd threading
          nimble test
