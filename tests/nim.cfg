--path:"../"
--mm:arc
--threads:on
--define:useMalloc

@if i386:
  @if windows:
    # The MinGW bundle CI installs for this row is the i686 one, but the Nim
    # nightly still drives it as a cross-compiler, so the -m32 has to be
    # spelled out.
    --cc:clang
    --passc:"-m32"
    --passl:"-m32"
  @else:
    # ThreadSanitizer ships no 32-bit x86 runtime, so the sanitised build below
    # cannot be used here. The 32-bit toolchain CI installs is the
    # gcc-multilib wrapper pair (see .github/workflows/ci.yml); clang is not
    # wrapped and would silently emit 64-bit objects.
    --cc:gcc
  @end
@else:
  --cc:clang
  @if not windows:
    --debugger:native
    --passc:"-fsanitize=thread -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer"
    --passl:"-fsanitize=thread -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer"
  @end
@end
